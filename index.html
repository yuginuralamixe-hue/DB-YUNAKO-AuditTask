<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YUNAKO Audit & Task Hub</title>
  <meta name="theme-color" content="#1E3A8A" />
  <meta name="description" content="Sistem Terpadu Schedule, Task Management, Quality Audit & Trial Report - YUNAKO" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-512.png" />

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              primary: '#1E3A8A',
              accent: '#2563EB',
            }
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Print Styling untuk Dokumen Laporan Audit & Trial Report */
    @media print {
      body { background: #FFFFFF !important; color: #0F172A !important; }
      aside, header, nav, .no-print { display: none !important; }
      main { padding: 0 !important; margin: 0 !important; overflow: visible !important; }
      .print-only-clean {
        box-shadow: none !important;
        border: 1px solid #CBD5E1 !important;
        break-inside: avoid;
      }
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-[#0F172A] dark:bg-[#0B1120] dark:text-[#F8FAFC] antialiased selection:bg-blue-600 selection:text-white">

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0 no-print"></div>

  <!-- 1. LOGIN VIEW -->
  <section id="login-view" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-100 via-blue-50 to-slate-200 dark:from-[#0B1120] dark:via-slate-900 dark:to-[#0B1120]">
    <div class="w-full max-w-md bg-white dark:bg-[#1E293B] rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 p-8">
      <div class="flex flex-col items-center text-center mb-8">
        <div class="w-16 h-16 rounded-2xl bg-[#1E3A8A] text-white flex items-center justify-center shadow-lg shadow-blue-900/20 mb-4 overflow-hidden">
          <img src="./icon-192.png" alt="YUNAKO" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" class="w-full h-full object-contain bg-white p-1" />
          <i data-lucide="shield-check" style="display:none;" class="w-8 h-8"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">YUNAKO Hub</h1>
        <p class="text-xs font-medium uppercase tracking-wider text-blue-600 dark:text-blue-400 mt-1">Schedule • Task • Quality Audit • Trial</p>
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">Masuk untuk mengelola jadwal, tugas, audit & laporan trial</p>
      </div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Username</label>
          <div class="relative">
            <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
            <input type="text" id="login-username" required autocomplete="username" placeholder="Masukkan username Anda"
              class="w-full pl-10 pr-4 py-2.5 text-sm rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Password</label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
            <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••"
              class="w-full pl-10 pr-10 py-2.5 text-sm rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition" />
            <button type="button" id="toggle-pass-btn" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="login-submit-btn"
          class="w-full py-2.5 px-4 bg-[#1E3A8A] hover:bg-blue-800 text-white font-semibold text-sm rounded-xl shadow-md shadow-blue-900/20 flex items-center justify-center gap-2 transition active:scale-[0.99]">
          <span>Masuk ke Aplikasi</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <div class="mt-8 pt-4 border-t border-slate-100 dark:border-slate-800 text-center">
        <p class="text-xs text-slate-400">Aplikasi by <span class="font-semibold text-slate-600 dark:text-slate-300">Yugi Nuralam Khoirulloh</span></p>
      </div>
    </div>
  </section>

  <!-- 2. MAIN APP SHELL -->
  <div id="app-shell" class="hidden min-h-screen flex flex-col lg:flex-row">

    <!-- DESKTOP SIDEBAR -->
    <aside class="hidden lg:flex lg:flex-col lg:w-64 lg:fixed lg:inset-y-0 bg-[#1E3A8A] text-white z-30 no-print">
      <div class="flex items-center gap-3 px-6 h-16 border-b border-blue-800/80">
        <div class="w-9 h-9 rounded-lg bg-white/10 flex items-center justify-center overflow-hidden">
          <img src="./icon-192.png" alt="YUNAKO" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" class="w-full h-full object-contain bg-white p-0.5" />
          <i data-lucide="shield-check" style="display:none;" class="w-5 h-5 text-blue-200"></i>
        </div>
        <div>
          <span class="font-bold text-base tracking-tight block leading-none">YUNAKO Hub</span>
          <span class="text-[11px] text-blue-200">Quality & Ops System</span>
        </div>
      </div>

      <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
        <button data-nav="dashboard" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition bg-blue-800 text-white">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
          <span>Dashboard</span>
        </button>
        <button data-nav="schedule" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-blue-100 hover:bg-blue-800/60 transition">
          <i data-lucide="calendar-days" class="w-4 h-4"></i>
          <span>Schedule & Agenda</span>
        </button>
        <button data-nav="tasks" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-blue-100 hover:bg-blue-800/60 transition">
          <i data-lucide="check-square" class="w-4 h-4"></i>
          <span>Task Manager</span>
        </button>
        <button data-nav="audit" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-blue-100 hover:bg-blue-800/60 transition">
          <i data-lucide="clipboard-check" class="w-4 h-4"></i>
          <span>Audit Center</span>
        </button>
        <button data-nav="trial" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-blue-100 hover:bg-blue-800/60 transition">
          <i data-lucide="flask-conical" class="w-4 h-4"></i>
          <span>Trial Report</span>
        </button>
        <button data-nav="capa" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-blue-100 hover:bg-blue-800/60 transition">
          <i data-lucide="alert-triangle" class="w-4 h-4"></i>
          <span>CAPA & Temuan</span>
        </button>
        <button data-nav="settings" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-blue-100 hover:bg-blue-800/60 transition">
          <i data-lucide="settings" class="w-4 h-4"></i>
          <span>Pengaturan</span>
        </button>
      </nav>

      <div class="p-4 border-t border-blue-800/80">
        <div class="flex items-center gap-3 mb-3">
          <div id="sidebar-avatar" class="w-9 h-9 rounded-full bg-blue-600 flex items-center justify-center font-bold text-sm">YN</div>
          <div class="min-w-0 flex-1">
            <p id="sidebar-user-name" class="text-sm font-semibold truncate">Yugi Nuralam</p>
            <p id="sidebar-user-role" class="text-xs text-blue-200 truncate">Admin • QC</p>
          </div>
        </div>
        <button id="desktop-logout-btn" class="w-full py-2 px-3 rounded-lg bg-blue-950/60 hover:bg-red-600/80 text-xs font-medium text-blue-100 hover:text-white flex items-center justify-center gap-2 transition">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
          <span>Keluar</span>
        </button>
        <p class="text-[10px] text-blue-300/70 text-center mt-3">Aplikasi by Yugi Nuralam Khoirulloh</p>
      </div>
    </aside>

    <!-- CONTENT WRAPPER -->
    <div class="flex-1 lg:pl-64 flex flex-col min-h-screen pb-20 lg:pb-6">

      <!-- TOP HEADER -->
      <header class="sticky top-0 z-20 h-16 bg-white/90 dark:bg-[#1E293B]/90 backdrop-blur border-b border-slate-200 dark:border-slate-800 px-4 lg:px-8 flex items-center justify-between no-print">
        <div class="flex items-center gap-3">
          <div class="lg:hidden w-8 h-8 rounded-lg bg-[#1E3A8A] text-white flex items-center justify-center overflow-hidden">
            <img src="./icon-192.png" alt="YUNAKO" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" class="w-full h-full object-contain bg-white p-0.5" />
            <i data-lucide="shield-check" style="display:none;" class="w-4 h-4"></i>
          </div>
          <div>
            <h2 id="page-title" class="text-base lg:text-lg font-bold text-slate-900 dark:text-white leading-tight">Dashboard</h2>
            <p id="sync-status-text" class="text-[11px] text-emerald-600 dark:text-emerald-400 flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span> Tersinkronisasi
            </p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button id="refresh-data-btn" title="Sinkronkan Data" class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          </button>

          <button id="theme-toggle-btn" title="Ganti Tema Gelap/Terang" class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition">
            <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
            <i data-lucide="sun" class="w-4 h-4 hidden dark:block text-amber-400"></i>
          </button>

          <button id="notif-btn" class="relative p-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition">
            <i data-lucide="bell" class="w-4 h-4"></i>
            <span id="notif-badge" class="hidden absolute -top-1 -right-1 w-4 h-4 rounded-full bg-red-600 text-white text-[10px] font-bold flex items-center justify-center">0</span>
          </button>
        </div>
      </header>

      <!-- MAIN DYNAMIC VIEWPORT -->
      <main id="main-content" class="flex-1 p-4 lg:p-8 max-w-7xl w-full mx-auto space-y-6">
        <!-- Views di-render secara dinamis oleh app.js -->
      </main>
    </div>

    <!-- MOBILE BOTTOM NAVIGATION BAR (5 Tab Utama) -->
    <nav class="lg:hidden fixed bottom-0 inset-x-0 z-30 bg-white dark:bg-[#1E293B] border-t border-slate-200 dark:border-slate-800 flex justify-around items-center h-16 px-1 no-print">
      <button data-nav="dashboard" class="nav-btn-mobile flex flex-col items-center justify-center flex-1 py-1 text-blue-600 dark:text-blue-400">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold mt-0.5">Home</span>
      </button>
      <button data-nav="schedule" class="nav-btn-mobile flex flex-col items-center justify-center flex-1 py-1 text-slate-500 dark:text-slate-400">
        <i data-lucide="calendar-days" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium mt-0.5">Jadwal</span>
      </button>
      <button data-nav="tasks" class="nav-btn-mobile flex flex-col items-center justify-center flex-1 py-1 text-slate-500 dark:text-slate-400">
        <i data-lucide="check-square" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium mt-0.5">Tugas</span>
      </button>
      <button data-nav="audit" class="nav-btn-mobile flex flex-col items-center justify-center flex-1 py-1 text-slate-500 dark:text-slate-400">
        <i data-lucide="clipboard-check" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium mt-0.5">Audit</span>
      </button>
      <button data-nav="trial" class="nav-btn-mobile flex flex-col items-center justify-center flex-1 py-1 text-slate-500 dark:text-slate-400">
        <i data-lucide="flask-conical" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium mt-0.5">Trial</span>
      </button>
    </nav>
  </div>

  <!-- MODAL OVERLAY CONTAINER -->
  <div id="modal-backdrop" class="hidden fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4 no-print">
    <div id="modal-box" class="w-full sm:max-w-2xl bg-white dark:bg-[#1E293B] rounded-t-2xl sm:rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 max-h-[92vh] flex flex-col overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
        <h3 id="modal-title" class="text-base font-bold text-slate-900 dark:text-white">Modal Title</h3>
        <button id="modal-close-btn" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="modal-body" class="p-6 overflow-y-auto space-y-4 text-sm"></div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
